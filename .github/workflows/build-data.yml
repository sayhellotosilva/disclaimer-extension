# Every time extension/data.js changes on GitHub, rebuild the online card data.
# The extension downloads docs/data/cards.json (served by GitHub Pages),
# so corrections reach everyone without reinstalling.
name: Build card data
on:
  push:
    branches: [main]
    paths: ["extension/data.js", "scripts/build-data.mjs"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-data.mjs
      - name: Commit the new card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data/cards.json
          git diff --cached --quiet || git commit -m "Update online card data"
          git push
