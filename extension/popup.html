<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:JBM;font-weight:400;src:url(fonts/jetbrains-mono-latin-400-normal.woff2)}
  @font-face{font-family:JBM;font-weight:700;src:url(fonts/jetbrains-mono-latin-700-normal.woff2)}
  @font-face{font-family:IS;font-weight:400;src:url(fonts/instrument-sans-latin-400-normal.woff2)}
  @font-face{font-family:IS;font-weight:600;src:url(fonts/instrument-sans-latin-600-normal.woff2)}
  :root{--bg:#f2f3f5;--ink:#14171a;--muted:#5d636a;--rule:#dadde1;--accent:#c4621f;--soft:rgba(232,128,58,.16)}
  @media (prefers-color-scheme:dark){:root{--bg:#14171b;--ink:#eef0f1;--muted:#a6aeb5;--rule:#2a2f35;--accent:#f0a06a;color-scheme:dark}}
  body{margin:0;width:280px;background:var(--bg);color:var(--ink);font:13px/1.45 IS,system-ui,sans-serif}
  .wrap{padding:16px 16px 14px}
  .wm{font:400 20px/1 JBM,monospace;color:var(--muted);display:inline-block;padding-top:.6em}
  .wm .ai{color:var(--accent);font-weight:700}
  .wm .i{position:relative}
  .wm .i::before{content:"*";position:absolute;left:50%;top:-.62em;transform:translateX(-50%);color:var(--accent);font-weight:700;font-size:1.15em}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
  .switch{position:relative;width:38px;height:22px}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;border-radius:999px;background:var(--rule);cursor:pointer;transition:.2s}
  .slider::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
  input:checked+.slider{background:var(--accent)}
  input:checked+.slider::before{transform:translateX(16px)}
  input:focus-visible+.slider{outline:2px solid var(--accent);outline-offset:2px}
  .count{font:400 12px JBM,monospace;color:var(--muted);margin-top:12px}
  .count b{color:var(--ink);font-weight:700}
  ul{list-style:none;margin:8px 0 0;padding:0}
  li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--rule)}
  li span:last-child{font-family:JBM,monospace;color:var(--accent)}
  .foot{margin-top:12px;font-size:11.5px;color:var(--muted)}
  .foot a{color:var(--muted)}
  .data{margin:12px 0 0;font:400 11.5px JBM,monospace;color:var(--muted)}
  .data button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <span class="wm" aria-label="disclaimer">discl<span class="ai">a<span class="i">ı</span></span>mer</span>
  <div class="row"><label for="on">Mark AI tools on pages</label>
    <label class="switch"><input type="checkbox" id="on"><span class="slider"></span></label></div>
  <div class="count" id="count">Looking at this page…</div>
  <ul id="list"></ul>
  <p class="data" id="data">Card data: built in</p>
  <p class="foot">Reads page text on your computer only. Nothing about it is sent anywhere. <a href="https://github.com/sayhellotosilva/disclaimer-extension" target="_blank" rel="noopener">Sources &amp; code</a></p>
</div>
<script src="popup.js"></script>
</body>
</html>
